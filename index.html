<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0a06">
<meta name="mobile-web-app-capable" content="yes">

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hearthstone">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Hearthstone Chronicles</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css">
<script src="src/pwa.js" defer></script>
</head>
<body>

<div id="header">
  <div>
    <h1>Hearthstone Chronicles</h1>
    <div class="sub">Age of the First Kings &middot; <span data-version-label>v1.2.9 / hc-v50</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <div id="power-badge" onclick="showPowerBreakdown()">&#x2694; <span id="power-val">0</span></div>
    <div class="faction-badge">
      <div class="fname">&#x2694; Men of the West</div>
      <div class="fera" id="era-display">First Age &middot; Year 1</div>
    </div>
  </div>
</div>

<!-- FLOATING RESOURCE BAR -->
<div id="resource-bar">
  <div id="resource-bar-inner"></div>
</div>

<div id="era-bar">
  <span class="era-label">Renown</span>
  <div class="pbar-outer"><div class="pbar-inner" id="prestige-bar" style="width:0%"></div></div>
  <span class="pval" id="prestige-val">0/1000</span>
  <span class="tick-label">Harvest</span>
  <div class="tick-outer"><div class="tick-inner" id="tick-bar"></div></div>
</div>

<div id="shell">
  <div id="sidebar">
    <button class="stab active" data-tab="kingdom" onclick="switchTab('kingdom')">&#x1F3F0;<span class="slabel">Kingdom</span></button>
    <button class="stab" data-tab="build" onclick="switchTab('build')">&#x1F3D7;<span class="slabel">Build</span><span class="bdot" id="bdot-build"></span></button>
    <button class="stab" data-tab="research" onclick="switchTab('research')">&#x1F4DA;<span class="slabel">Research</span><span class="bdot" id="bdot-research"></span></button>
    <button class="stab" data-tab="combat" onclick="switchTab('combat')">&#x2694;<span class="slabel">Combat</span><span class="bdot" id="bdot-combat"></span></button>
    <button class="stab" data-tab="heroes" onclick="switchTab('heroes')">&#x1F9B8;<span class="slabel">Heroes</span><span class="bdot" id="bdot-heroes"></span></button>
    <button class="stab" data-tab="faction" onclick="switchTab('faction')">&#x269C;<span class="slabel">Faction</span></button>
  </div>

  <div id="content">

    <!-- KINGDOM TAB -->
    <div class="tab-view active" id="tab-kingdom">
      <div class="section">
        <div class="section-title">Kingdom Resources</div>
        <div class="resource-grid" id="resource-grid"></div>
      </div>
      <div class="section">
        <div id="chronicle-goals"></div>
      </div>
      <div class="section" style="padding:0;overflow:hidden;border-radius:6px;">
        <div id="city-view">
          <div class="city-title">&#x2694; Kingdom of Arnethia &mdash; tap a building to manage it</div>
          <div class="city-map" id="city-map"></div>
        </div>
      </div>
      <div class="section">
        <div class="section-title">&#x1F4DC; Chronicle</div>
        <div class="log-entries" id="log-entries"></div>
      </div>
    </div>

    <!-- BUILD TAB -->
    <div class="tab-view" id="tab-build">
      <div class="section">
        <div class="section-title">Construct &amp; Upgrade</div>
        <div class="blist" id="building-list"></div>
      </div>
    </div>

    <!-- RESEARCH TAB -->
    <div class="tab-view" id="tab-research">
      <div class="section">
        <div class="section-title">Research</div>
        <div class="rtabs">
          <div class="rtab active" data-tab="economy" onclick="switchResearchTab('economy')">Economy</div>
          <div class="rtab" data-tab="military" onclick="switchResearchTab('military')">Military</div>
          <div class="rtab tab-locked" data-tab="arcane" onclick="switchResearchTab('arcane')" id="rtab-arcane">Arcane</div>
          <div class="rtab tab-locked" data-tab="diplomacy" onclick="switchResearchTab('diplomacy')" id="rtab-diplomacy">Diplomacy</div>
        </div>
        <div class="rlist" id="research-list"></div>
      </div>
    </div>

    <!-- HEROES TAB -->
    <div class="tab-view" id="tab-heroes">
      <div class="section">
        <div class="section-title">Heroes of Arnethia</div>
        <div class="hlist" id="hero-list"></div>
      </div>
    </div>

    <!-- COMBAT TAB -->
    <div class="tab-view" id="tab-combat"></div>

    <!-- FACTION TAB -->
    <div class="tab-view" id="tab-faction">
    </div>

  </div>
</div>

<div id="bottombar">
  <div class="btabs">
    <button class="btab active" data-tab="kingdom" onclick="switchTab('kingdom')">&#x1F3F0;<span class="blabel">Kingdom</span></button>
    <button class="btab" data-tab="build" onclick="switchTab('build')">&#x1F3D7;<span class="blabel">Build</span><span class="bdot" id="mbdot-build"></span></button>
    <button class="btab" data-tab="research" onclick="switchTab('research')">&#x1F4DA;<span class="blabel">Research</span><span class="bdot" id="mbdot-research"></span></button>
    <button class="btab" data-tab="combat" onclick="switchTab('combat')">&#x2694;<span class="blabel">Combat</span><span class="bdot" id="mbdot-combat"></span></button>
    <button class="btab" data-tab="heroes" onclick="switchTab('heroes')">&#x1F9B8;<span class="blabel">Heroes</span><span class="bdot" id="mbdot-heroes"></span></button>
    <button class="btab" data-tab="faction" onclick="switchTab('faction')">&#x269C;<span class="blabel">Faction</span></button>
  </div>
</div>

<div id="overlay-stack"></div>

<script src="src/data/progression.js" defer></script>
<script src="src/data/buildings.js" defer></script>
<script src="src/data/research.js" defer></script>
<script src="src/data/combat.js" defer></script>
<script src="src/data/heroes.js" defer></script>
<script src="src/data/map.js" defer></script>
<script src="src/save.js" defer></script>
<script src="src/game.js" defer></script>
<!-- BUILDING POPUP -->
<div id="building-popup">
  <button class="bp-close" onclick="closePopup()">&#x2715;</button>
  <div class="bp-name" id="bp-name"></div>
  <div class="bp-desc" id="bp-desc"></div>
  <div class="bp-stats" id="bp-stats"></div>
  <div class="bp-cost" id="bp-cost"></div>
  <button class="bp-btn" id="bp-btn" onclick="popupUpgrade()">Upgrade</button>
</div>

</body>
</html>
